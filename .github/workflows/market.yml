name: Piyasa verisi güncelle
on:
  schedule:
    - cron: '30 15 * * 1-5'   # Hafta içi 18:30 (TR) — BIST kapanışından sonra
    - cron: '0 9 * * 0,6'     # Hafta sonu — sadece Bitcoin değişir
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-market.mjs
      - name: Değiştiyse kaydet
        run: |
          git config user.name "piyasa-botu"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Piyasa verisi $(date +%F)" && git push
